# JupyterHub (z2jh) values for the A3-Mega TCPXO cluster.
#
# Cluster : hypercomputer-a3-tcpxo   (asia-southeast1-c)
# Release : helm upgrade jhub jupyterhub/jupyterhub -n jupyter --reuse-values -f values-tcpxo.yaml
#
# NOTE: this file carries NO credentials -- this repo is public. The Google OAuth
# client_id/client_secret live only in the live release (secret/hub) and are preserved
# across upgrades by --reuse-values. Never inline them here.
#
# IMPORTANT -- brace escaping in extra_annotations
# ------------------------------------------------
# kubespawner runs every extra_annotations value through Python str.format() via
# _expand_user_properties() to expand {username}/{userid}. Any literal { or } in the
# value must therefore be DOUBLED, or the spawn dies before the pod is created with:
#     KeyError: '"interfaceName"'
# That is why the networking.gke.io/interfaces JSON below uses {{ and }}.
# The rendered annotation is normal single-brace JSON.

singleuser:
  startTimeout: 1200
  storage:
    capacity: 20Gi
    dynamic:
      storageClass: premium-rwo

  profileList:
    - display_name: "CPU (no GPU)"
      default: true
      kubespawner_override:
        cpu_limit: 4
        mem_limit: "16G"

    - display_name: "GPU (1x H100 Mega)"
      kubespawner_override:
        image: quay.io/jupyter/pytorch-notebook:cuda12-latest
        extra_resource_limits:
          nvidia.com/gpu: "1"
        node_selector:
          cloud.google.com/gke-accelerator: nvidia-h100-mega-80gb
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-queued"
            operator: "Exists"
            effect: "NoSchedule"

    - display_name: "GPU (8x H100 Mega, TCPXO fabric)"
      kubespawner_override:
        image: quay.io/jupyter/pytorch-notebook:cuda12-latest
        environment:
          LD_LIBRARY_PATH: /usr/local/nvidia/lib64
          NCCL_FASTRAK_LLCM_DEVICE_DIRECTORY: /dev/aperture_devices
          NCCL_LIB_DIR: /usr/local/nvidia/lib64
        extra_annotations:
          # Braces doubled -- see the brace-escaping note at the top of this file.
          networking.gke.io/default-interface: eth0
          networking.gke.io/interfaces: |
            [
              {{"interfaceName":"eth0","network":"default"}},
              {{"interfaceName":"eth1","network":"gpu-net-0"}},
              {{"interfaceName":"eth2","network":"gpu-net-1"}},
              {{"interfaceName":"eth3","network":"gpu-net-2"}},
              {{"interfaceName":"eth4","network":"gpu-net-3"}},
              {{"interfaceName":"eth5","network":"gpu-net-4"}},
              {{"interfaceName":"eth6","network":"gpu-net-5"}},
              {{"interfaceName":"eth7","network":"gpu-net-6"}},
              {{"interfaceName":"eth8","network":"gpu-net-7"}}
            ]
          # No braces here, so this value needs no escaping.
          devices.gke.io/container.notebook: |
            - path: /dev/nvidia0
            - path: /dev/nvidia1
            - path: /dev/nvidia2
            - path: /dev/nvidia3
            - path: /dev/nvidia4
            - path: /dev/nvidia5
            - path: /dev/nvidia6
            - path: /dev/nvidia7
            - path: /dev/nvidiactl
            - path: /dev/nvidia-uvm
            - path: /dev/dmabuf_import_helper
        extra_container_config:
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
        extra_resource_limits:
          nvidia.com/gpu: "8"
        node_selector:
          cloud.google.com/gke-accelerator: nvidia-h100-mega-80gb
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-queued"
            operator: "Exists"
            effect: "NoSchedule"
        volume_mounts:
          - name: nvidia
            mountPath: /usr/local/nvidia/lib64
          - name: aperture-devices
            mountPath: /dev/aperture_devices
          - name: shm
            mountPath: /dev/shm
        volumes:
          - name: nvidia
            hostPath:
              path: /home/kubernetes/bin/nvidia/lib64
          - name: aperture-devices
            hostPath:
              path: /dev/aperture_devices
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
